name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d .gradle-bin
          echo "$GITHUB_WORKSPACE/.gradle-bin/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Use the CI Android SDK
        run: |
          rm -f local.properties
          sed -i '/org.gradle.java.home/d' gradle.properties
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeCheckAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
